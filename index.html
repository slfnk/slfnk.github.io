<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GUIIDES — coming soon...</title>
<meta name="description" content="Authored city guides. Writing first, map follows. Coming soon.">
<meta property="og:title" content="GUIIDES">
<meta property="og:description" content="Authored city guides. Coming soon.">
<link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="GUIIDES">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@1,8..60,400&family=DM+Sans:wght@500;700&display=swap">
<style>
  :root { --bg: #FAF9F6; --text-2: #5C5C5C; --brand: #038f9e; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem 1.5rem;
  }
  .wordmark {
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: clamp(2rem, 8vw, 4.5rem);
    font-weight: 500;
    color: var(--brand);
    letter-spacing: 0.04em;
    line-height: 1.1;
  }
  .wordmark strong { font-weight: 700; letter-spacing: 0.08em; }
  .soon {
    font-family: 'Source Serif 4', Georgia, serif;
    font-style: italic;
    font-size: clamp(1rem, 2.6vw, 1.3rem);
    color: var(--text-2);
    margin-top: 1rem;
  }
  /* Borrows the guide's banner pool; hides itself if a file can't load */
  .banner {
    width: min(60vw, 420px);
    aspect-ratio: 1600 / 119;
    margin-top: 2.25rem;
    background-size: cover;
    background-position: center;
    -webkit-clip-path: polygon(0 50%, 14.6% 0, 84.6% 0, 100% 50%, 84.6% 100%, 14.6% 100%);
    clip-path: polygon(0 50%, 14.6% 0, 84.6% 0, 100% 50%, 84.6% 100%, 14.6% 100%);
    opacity: 0;
    transition: opacity 0.5s ease-out;
  }
  .banner.loaded { opacity: 1; }
  .banner.failed { display: none; }
</style>
</head>
<body>
  <h1 class="wordmark">⛺︎ <strong>GUIIDES</strong> ⛺︎</h1>
  <div class="banner" id="banner" role="presentation"></div>
  <p class="soon">coming soon</p>
<script>
(function() {
  const el = document.getElementById('banner');
  const src = '/banners/banner_' + (Math.floor(Math.random() * 20) + 1) + '.webp';
  const img = new Image();
  img.onload = () => { el.style.backgroundImage = 'url(' + src + ')'; el.classList.add('loaded'); };
  img.onerror = () => el.classList.add('failed');
  img.src = src;
})();
</script>
</body>
</html>
